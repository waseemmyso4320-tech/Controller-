name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build Debug APK
        run: gradle :app:assembleDebug

      - name: Create signing key
        run: |
          keytool -genkeypair             -keystore debug.keystore             -storepass android             -keypass android             -alias androiddebugkey             -keyalg RSA             -keysize 2048             -validity 10000             -dname "CN=Android Debug,O=Android,C=US"

      - name: Sign APK
        run: |
          $ANDROID_HOME/build-tools/35.0.0/apksigner sign             --ks debug.keystore             --ks-pass pass:android             --key-pass pass:android             --out app/build/outputs/apk/debug/LudoQAController.apk             app/build/outputs/apk/debug/app-debug.apk

      - name: Verify APK
        run: |
          $ANDROID_HOME/build-tools/35.0.0/apksigner verify --verbose app/build/outputs/apk/debug/LudoQAController.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: LudoQAController-debug
          path: app/build/outputs/apk/debug/LudoQAController.apk
